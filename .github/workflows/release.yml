name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Generate a token
        id: generate-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          owner: coveooss
          repositories: 'mossy'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: step-security/changeset-action@6ddf46283ed49170eb6ca2179818f7d2a0ae687c # v1.9.0
        with:
          version: pnpm run version-packages
          publish: pnpm changeset tag
          commit: "chore: version packages"
          title: "chore: version packages"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}

  build-mac:
    name: Build macOS
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Get version
        id: version
        run: echo "version=$(echo '${{ needs.release.outputs.publishedPackages }}' | jq -r '.[0].version')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "mossy@${{ steps.version.outputs.version }}"

      - uses: ./.github/actions/setup

      - name: Build and package
        working-directory: packages/mossy
        run: pnpm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: Mossy-mac
          path: |
            packages/mossy/artifacts/*.dmg
            packages/mossy/artifacts/*.tar.zst
            packages/mossy/artifacts/*-update.json
          retention-days: 30

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "mossy@${{ steps.version.outputs.version }}" \
            packages/mossy/artifacts/*.dmg \
            packages/mossy/artifacts/*.tar.zst \
            packages/mossy/artifacts/*-update.json \
            --clobber
