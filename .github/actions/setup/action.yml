name: 'Setup'
description: 'Install Node, pnpm and Bun via mise, then install dependencies'
runs:
  using: composite
  steps:
    - name: Install tools via mise
      uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4
      with:
        install: true
        cache: true

    - name: Get pnpm store directory
      id: pnpm-store
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
